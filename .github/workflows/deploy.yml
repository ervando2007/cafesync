name: Deploy CafeSync

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            echo "================================"
            echo "Deploying CafeSync"
            echo "================================"

            cd ~/projects/nextjs/cafesync-app

            echo "Pull latest source..."
            git pull --ff-only origin main

            echo "Installing dependencies..."
            npm install

            echo "Building Next.js..."
            npm run build

            # Restart right after the build: the running server still holds the
            # old build in memory and serves 404s/errors against the new .next.
            # Needs a sudoers rule on the VPS:
            #   andryboy ALL=(root) NOPASSWD: /usr/bin/systemctl restart cafesync
            echo "Restarting cafesync.service..."
            sudo -n /usr/bin/systemctl restart cafesync

            echo "Waiting for the app to answer..."
            for i in $(seq 1 20); do
              curl -sf -o /dev/null http://127.0.0.1:3000/ && break
              sleep 3
            done
            curl -sf -o /dev/null http://127.0.0.1:3000/

            echo "================================"
            echo "Deployment completed"
            echo "================================"